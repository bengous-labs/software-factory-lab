name: code-review

# The Code review of one pull request: Claude Code's native `/code-review`, run through the Agent SDK by
# `factory/bin/code-review.ts`. The Merge bot dispatches it with the request as inputs and
# reads the result from the run's artifact. The job holds no App token and writes nothing to GitHub:
# the pull request's head is checked out under `pr/` as files to read, and nothing of it runs. The
# inputs reach the steps through `env`, never inside a script. Only the thread step, run on every Review
# round, gets the job's token, read-only; the review session gets none.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      head:
        description: The commit to review, the pull request's head
        required: true
      base:
        description: Where the reviewed range starts
        required: true
      patch:
        description: The patch identity the Merge bot keys the review on
        required: true
      round:
        description: The review round, 1, 2 or 3, or 4 for the Delta read of a push after round 3
        required: true
      model:
        description: The model alias
        required: true
      effort:
        description: The effort level of /code-review
        required: true
      security:
        description: Whether a security pass runs after the Code review, true or false
        required: true

# The number alone: the Merge bot reads it back from `workflow_run.display_title`.
run-name: ${{ inputs.pr }}

# No concurrency group: GitHub never cancels a review run, so a run that ends cancelled was stopped by
# a person or by the job's timeout. Two Merge bot decisions on one PR, a Sweep's and an event's, can
# each dispatch a review: both runs finish, and the Merge bot reads the one its record names, so the
# race costs a review and never fails one. A review a new push made stale runs to its end, and its
# result is ignored.

permissions:
  contents: read
  # The thread step's only: it reads the PR's body and its earlier review threads.
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    # A last resort: the runner times out first and writes the cause, while a job timeout cancels the job
    # with no result.
    timeout-minutes: 50
    env:
      REVIEW_PR: ${{ inputs.pr }}
      REVIEW_HEAD: ${{ inputs.head }}
      REVIEW_BASE: ${{ inputs.base }}
      REVIEW_PATCH: ${{ inputs.patch }}
      REVIEW_ROUND: ${{ inputs.round }}
      REVIEW_MODEL: ${{ inputs.model }}
      REVIEW_EFFORT: ${{ inputs.effort }}
      REVIEW_SECURITY: ${{ inputs.security }}
    steps:
      - name: Checkout the dispatched ref
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the pull request's head under pr/
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.head }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun via mise
        uses: jdx/mise-action@v5.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the earlier review threads
        run: bun factory/bin/review-threads.ts
        env:
          GH_TOKEN: ${{ github.token }}
          APP_LOGIN: bengous-labs-agents[bot]

      - name: Review
        run: bun factory/bin/code-review.ts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Write a failed result when the runner wrote none
        if: failure()
        run: |
          test -f review-result.json || jq -n \
            --argjson pr "$REVIEW_PR" --arg head "$REVIEW_HEAD" --arg base "$REVIEW_BASE" --arg patch "$REVIEW_PATCH" \
            --argjson round "$REVIEW_ROUND" --arg model "$REVIEW_MODEL" --arg effort "$REVIEW_EFFORT" \
            --arg security "$REVIEW_SECURITY" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{kind: "failed", cause: "the review job stopped before the runner wrote its result",
              request: {pr: $pr, head: $head, base: $base, patch: $patch, round: $round, model: $model, effort: $effort,
                security: ($security == "true")},
              model: null, claudeCodeVersion: null, tokens: null, runUrl: $runUrl}' > review-result.json

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: review-${{ inputs.pr }}-${{ inputs.round }}
          path: review-result.json
          if-no-files-found: error
          overwrite: true
