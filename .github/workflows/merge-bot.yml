name: merge-bot

# Runs the Merge bot (`scripts/land-loop/merge-bot/main.ts`) from the default branch, never from the
# PR: `workflow_run` and `pull_request_target` both read this file and the checkout from `dev`, and the
# PR's head is fetched as git data only. Every write goes through the agents' App: a `GITHUB_TOKEN`
# write starts no GitHub workflow, and only an App can post check runs. A Sweep, a Merge bot run over
# every open PR, catches what no event carries, such as a review thread resolved, and what a landing
# changes in the other open PRs, such as a new conflict. A push to the Trunk is the Sweep's main
# trigger; the schedule is a net, because GitHub may drop scheduled runs.
on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    # `dequeued` is GitHub's name for an Ejection.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, dequeued]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number, or empty for every open PR
        required: false

# One Merge bot run per PR at a time, whichever event starts it: a PR event, a CI completion and a
# dispatch for the same PR all key on its number, so their Merge bot runs follow one another, never
# side by side. A later event waits, and reads the PR afresh. Every Sweep shares the `sweep` key.
concurrency:
  group: merge-bot-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

permissions: {}

jobs:
  merge-bot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the agents' App token
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_KEY }}
          permission-checks: write
          # write: enabling auto-merge needs it; the job never pushes.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Set up bun via mise
        uses: jdx/mise-action@v5.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the Merge bot
        run: bun scripts/land-loop/merge-bot/main.ts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OWNER: bengous
          APP_LOGIN: bengous-labs-agents[bot]
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EJECTION_REASON: ${{ github.event.action == 'dequeued' && (github.event.reason || 'no reason given') || '' }}
