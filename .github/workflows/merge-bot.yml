name: merge-bot

# Runs the Merge bot (`scripts/land-loop/merge-bot/main.ts`) from the default branch, never from the
# PR: `workflow_run` and `pull_request_target` both read this file and the checkout from `dev`, and the
# PR's head is fetched as git data only. Every write goes through the agents' App: a `GITHUB_TOKEN`
# write starts no GitHub workflow, and only an App can post check runs. A Sweep, a start that makes one
# Merge bot run for every open PR, catches what no event carries, such as a review thread resolved, and
# what a landing changes in the other open PRs, such as a new conflict. A push to the Trunk is the
# Sweep's main trigger; the schedule is a net, because GitHub may drop scheduled runs. CI's completion
# on a push to the Trunk starts a Sweep too: the Merge bot reads dev's red from that run, which ends
# after the push's own Sweep. A completed review job (`code-review.yml`, dispatched by the Merge bot)
# only wakes the Merge bot for its PR, whose number is the run's title: each decision reads the
# review's run and artifact by the id in the record.
on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [CI, code-review]
    types: [completed]
  pull_request_target:
    # `dequeued` is GitHub's name for an Ejection.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, dequeued]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number, or empty for every open PR
        required: false

# One Merge bot run per PR at a time, whichever event starts it: a PR event, a CI completion and a
# dispatch for the same PR all key on its number, so their Merge bot runs follow one another, never
# side by side. A later event waits, and reads the PR afresh. Every Sweep shares the `sweep` key, CI's
# completion on a push first: GitHub fills its `pull_requests` with any open PR whose head is `dev`. A
# dispatched run names no pull request: the review job's run carries the PR's number as its title. Its
# `workflow_run.name` is that title too, not the workflow's name, so the review run is known by its path.
concurrency:
  group: merge-bot-${{ (github.event.workflow_run.event == 'push' && 'sweep') || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || (github.event.workflow_run.path == '.github/workflows/code-review.yml' && github.event.workflow_run.display_title) || inputs.pr || 'sweep' }}
  cancel-in-progress: false

permissions: {}

jobs:
  merge-bot:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' ||
      (github.event.workflow_run.path == '.github/workflows/code-review.yml' && github.event.workflow_run.event == 'workflow_dispatch') ||
      (github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the agents' App token
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_KEY }}
          permission-checks: write
          # write: the job dispatches the review job, then reads its runs and artifacts.
          permission-actions: write
          # write: enabling auto-merge needs it; the job never pushes.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Set up bun via mise
        uses: jdx/mise-action@v5.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the Merge bot
        run: bun scripts/land-loop/merge-bot/main.ts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OWNER: bengous
          APP_LOGIN: bengous-labs-agents[bot]
          EVENT_NAME: ${{ github.event_name }}
          # `|| ''` last: a false `&&` would otherwise reach the Merge bot as "false".
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr || (github.event.workflow_run.path == '.github/workflows/code-review.yml' && github.event.workflow_run.display_title) || '' }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          EJECTION_REASON: ${{ github.event.action == 'dequeued' && (github.event.reason || 'no reason given') || '' }}
