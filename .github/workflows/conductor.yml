name: conductor

# Runs the PR conductor (`scripts/harness/conductor/main.ts`) from the default branch, never from the
# PR: `workflow_run` and `pull_request_target` both read this file and the checkout from `dev`, and the
# PR's head is fetched as git data only. Every write goes through the agents' App: a `GITHUB_TOKEN`
# write starts no workflow, and only an App can post check runs. The sweep catches what no event
# carries, such as a review thread resolved.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, dequeued]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number, or empty for every open PR
        required: false

# One run per PR branch at a time, whichever event starts it: a PR event and a CI completion for the
# same branch run one after the other, never side by side. A later event waits, and reads the PR afresh.
concurrency:
  group: conductor-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || inputs.pr || 'sweep' }}
  cancel-in-progress: false

permissions: {}

jobs:
  conduct:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the agents' App token
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_KEY }}
          permission-checks: write
          # write: enabling auto-merge needs it; the job never pushes.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Set up bun via mise
        uses: jdx/mise-action@v5.2.5

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.318

      - name: Conduct
        run: bun scripts/harness/conductor/main.ts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OWNER: bengous
          APP_LOGIN: bengous-labs-agents[bot]
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEQUEUE_REASON: ${{ github.event.action == 'dequeued' && (github.event.reason || 'removed from the queue') || '' }}
