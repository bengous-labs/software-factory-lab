name: CI

# The deterministic check. `merge_group` is what the merge queue sends for the commit it tests:
# without it, `validate` never reports there and the queue waits until it times out.
on:
  pull_request:
    branches: [dev]
  merge_group:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up bun via mise
        uses: jdx/mise-action@v5.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, format, gates and test
        run: bun check

  # Mutation testing on the lines a change alters in the modules `stryker.config.ts` lists, or in
  # their tests (`scripts/ci/mutation.ts`): a pull request's since its base, a push's since its
  # `before`. Not in the merge queue: the queue lands on `validate` alone, nothing reads the result
  # there. The push of the queue's commit to `dev` mutates it after landing: that run detects what
  # PRs landed together broke, it does not prevent it, and its red holds every landing (`devRed`).
  # With nothing to mutate it passes before installing anything.
  mutation:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    env:
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the merge-base with the base

      - name: Set up bun via mise
        uses: jdx/mise-action@v5.2.5

      - name: Scope the mutants to the changed lines
        id: scope
        run: bun scripts/ci/mutation.ts github-output

      - name: Install dependencies
        if: steps.scope.outputs.mutate == 'true'
        run: bun install --frozen-lockfile

      - name: Mutation-test the changed lines
        if: steps.scope.outputs.mutate == 'true'
        run: bun scripts/ci/mutation.ts run
